<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mercado Virtual Praia Mar</title>
  <meta name="description" content="Passeie pelo Mercado Praia Mar em 3D, escolha os produtos na prateleira e monte o seu carrinho.">
  <link rel="icon" href="/mercado-praia-mar/assets/marca/logo-mercado.webp">
  <!-- instalável como app ("Adicionar à tela inicial"): abre em tela cheia, deitado -->
  <link rel="manifest" href="/mercado-praia-mar/manifest.webmanifest">
  <meta name="theme-color" content="#12337f">
  <link rel="apple-touch-icon" href="/mercado-praia-mar/assets/marca/icone-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Praia Mar">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Sans+3:wght@400;600;700&display=swap">
  <script type="module" crossorigin src="/mercado-praia-mar/assets/loja-BzGLAtte.js"></script>
  <link rel="modulepreload" crossorigin href="/mercado-praia-mar/assets/montar-BqEarZ6k.js">
  <link rel="stylesheet" crossorigin href="/mercado-praia-mar/assets/loja-tvPkDOP3.css">
</head>
<body>
  <div id="palco" aria-label="Loja em 3D"></div>

  <header class="hud" id="topo" hidden>
    <div class="marca"><img src="/mercado-praia-mar/assets/marca/logo-mercado.webp" alt=""><div><b>Mercado Virtual</b><span>Praia Mar</span></div></div>
    <div class="ferramentas">
      <button class="chip" id="telaCheia" hidden aria-label="Tela cheia">⛶</button>
      <button class="chip" id="menu" aria-label="Menu (Esc)">☰ Menu</button>
      <button class="chip" id="vista" aria-label="Trocar câmera (C)"><span id="vistaRotulo">3ª pessoa</span></button>
      <button class="chip carrinho" data-acao="carrinho" aria-label="Abrir carrinho"><span id="qtdCarrinho">0</span><span id="totalCarrinho">R$ 0,00</span></button>
    </div>
  </header>
  <div id="balao" hidden></div>
  <div id="demo" hidden>Vitrine de demonstração: produtos e preços ilustrativos até o cadastro da loja</div>
  <div id="mira" hidden></div>
  <button id="alvo" hidden><kbd>E</kbd><span><b></b><small></small></span></button>
  <div id="dica" hidden></div>
  <div id="joy" hidden aria-hidden="true"><i></i></div>
  <button id="lupa" class="chip" hidden aria-pressed="false" aria-label="Aproximar a vista">🔍</button>
  <section id="painel" hidden role="dialog" aria-modal="false" aria-labelledby="painelTitulo"></section>
  <div id="aviso" role="status" aria-live="polite" hidden></div>

  <div id="abertura">
    <div class="cartao">
      <div class="cartao-topo">
        <img src="/mercado-praia-mar/assets/marca/logo-mercado.webp" alt="Praia Mar" class="logo">
        <h1>Mercado Virtual<br>Praia Mar</h1>
        <p>Entre na loja, ande pelos corredores, pegue os produtos na prateleira e monte o seu carrinho.</p>
      </div>
      <div class="cartao-corpo">
        <div class="quem" role="group" aria-label="Quem vai fazer as compras">
          <button data-avatar="mulher" aria-pressed="true" aria-label="Mulher"><img src="/mercado-praia-mar/assets/modelos/personagens/mulher-retrato.webp" alt=""></button>
          <button data-avatar="homem" aria-pressed="false" aria-label="Homem"><img src="/mercado-praia-mar/assets/modelos/personagens/homem-retrato.webp" alt=""></button>
        </div>
        <div id="carga"><span id="cargaMsg">Carregando a loja…</span><div class="barra"><i id="cargaBarra"></i></div></div>
        <button class="btn pri" id="entrar" disabled>Entrar na loja</button>
        <details><summary>Controles</summary><div class="teclas" id="teclas"></div></details>
      </div>
    </div>
  </div>

</body>
</html>
